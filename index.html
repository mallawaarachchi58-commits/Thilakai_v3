<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thilak AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      text-align: center;
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
    }

    h1 {
      color: #38bdf8;
    }

    p {
      font-size: 18px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>🤖 Thilak AI</h1>
    <p>Welcome! Your AI server is running successfully.</p>
    <button onclick="alert('Thilak AI is working!')">Test AI</button>
  </div>

</body>
</html>
